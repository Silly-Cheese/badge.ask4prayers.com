<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="The Prayer Project Badge System — issue, carry, scan, and verify official credentials." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TPP Badge" />
  <title>The Prayer Project Badge System</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css?v=8" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="site-header">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">TPP</span>
      <span class="brand-copy">
        <strong>The Prayer Project</strong>
        <small>Badge System</small>
      </span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Open navigation" aria-expanded="false">☰</button>
    <nav class="site-nav" id="siteNav">
      <a href="#/">Home</a>
      <a href="#/scan">Scan</a>
      <a href="#/admin" data-admin-link hidden>Admin</a>
      <button class="nav-button" id="signOutButton" hidden>Sign out</button>
    </nav>
  </header>

  <main id="app" class="app-shell" aria-live="polite">
    <section class="loading-screen">
      <div class="loader"></div>
      <p>Loading Badge System…</p>
    </section>
  </main>

  <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
  <section id="printSheet" class="print-sheet" aria-hidden="true"></section>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="./app.js?v=8"></script>
</body>
</html>
